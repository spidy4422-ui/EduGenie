<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Set character encoding for the webpage -->
    <meta charset="UTF-8">

    <!-- Make the login page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the title shown in the browser tab -->
    <title>Login - EduGenie</title>

    <!-- Connect the common EduGenie stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

    <!-- Login Section -->
    <section class="login-section">

        <!-- Login heading -->
        <h1>Welcome Back</h1>

        <!-- Short login description -->
        <p>Login to continue your EduGenie journey.</p>


        <!-- Display login error message if login fails -->
        {% if error %}
            <p class="login-error">{{ error }}</p>
        {% endif %}


        <!-- Login form -->
        <!-- Send login details to the Flask login route -->
        <form method="POST" action="/login">

            <!-- User email input -->
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <!-- User password input -->
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <!-- Submit login form -->
            <button type="submit">
                Login
            </button>

        </form>

        <!-- Registration option -->
        <p>
            Don't have an account?
            <a href="/register">Create Account</a>
        </p>

    </section>

</body>

</html>
