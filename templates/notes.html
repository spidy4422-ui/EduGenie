<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Set character encoding -->
    <meta charset="UTF-8">

    <!-- Make the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set browser tab title -->
    <title>Notes - EduGenie</title>

    <!-- Connect the subjects stylesheet for now -->
    <!-- Load the dedicated Notes page stylesheet -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/notes.css') }}">
</head>

<body>

    <!-- Navigation bar -->
    <nav class="dashboard-navbar">

        <!-- EduGenie logo -->
        <div class="dashboard-logo">
            EduGenie
        </div>

        <!-- Navigation links -->
        <ul class="dashboard-nav-links">

            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/subjects">Subjects</a></li>
            <li><a href="/todos">To-Do</a></li>
            <li><a href="/logout">Logout</a></li>

        </ul>
    </nav>


    <!-- Main Notes section -->
    <main class="subjects-page">

        <!-- Page heading -->
        <h1>My Notes 📝</h1>

        <!-- Page description -->
        <p>
            Create and manage your study notes from one place.
        </p>


        <!-- Add Note form -->
        <form class="subject-form" method="post" action="/notes">

            <!-- Note title -->
            <input
                type="text"
                name="title"
                placeholder="Enter note title"
                required
            >

            <!-- Note content -->
            <textarea
                name="content"
                placeholder="Write your note here..."
                rows="6"
                required
            ></textarea>

            <!-- Add Note button -->
            <button type="submit">
                Add Note
            </button>

        </form>


        <!-- Display saved notes -->
        <section class="subject-list">

            {% for note in notes %}

                <!-- Display one saved note -->
                <div class="subject-card">

                    <!-- Display note title -->
                    <h3>
                        {{ note["title"] }}
                    </h3>

                    <!-- Display note content -->
                    <p>
                        {{ note["content"] }}
                    </p>

                    <!-- Open the edit page for this note -->
                        <a
                            href="/edit_note/{{ note['id'] }}"
                            class="edit-note-btn"
                        >
                            Edit
                        </a>
                                      <a
                        href="/delete_note/{{ note['id'] }}"
                        class="delete-subject-btn"
                        onclick="return confirm('Are you sure you want to delete this note?');"
                    >
                        Delete
                    </a>

                </div>

            {% else %}

                <!-- Display this when no notes exist -->
                <p class="empty-subjects">
                    No notes added yet. Add your first note above.
                </p>

            {% endfor %}

        </section>

    </main>

</body>

</html>
