<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Set character encoding for the webpage -->
    <meta charset="UTF-8">

    <!-- Make the registration page responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set browser tab title -->
    <title>Register - EduGenie</title>

    <!-- Connect the common EduGenie stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">

</head>

<body>

    <!-- Registration Section -->
<section class="login-section">

    <h1>Create Account</h1>

    <p>Join EduGenie and start managing your studies.</p>

    <!-- Display registration error -->
    {% if error %}
        <p class="register-error">{{ error }}</p>
    {% endif %}

    <!-- Display success message after account creation -->
{% if success %}
    <p class="register-success">{{ success }}</p>
{% endif %}

    <form method="post" action="/register">

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <input
            name="email"
            type="email"
            placeholder="Enter your email"
            required
        >

        <input
            name="password"
            type="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <p>
        Already have an account?
        <a href="/login">Login</a>
    </p>

</section>

</body>

</html>
