<!-- This page provides the Notes Summarizer interface.
     The form sends the student's notes to Flask,
     where Gemini/OpenRouter generates the summary. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive on different screen sizes. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes Summarizer - EduGenie</title>

    <!-- Connect this page with its dedicated CSS file. -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/notes_summarizer.css') }}"
    >
</head>

<body>

    <!-- Main container for the Notes Summarizer page. -->
    <div class="summarizer-container">

        <!-- Page heading. -->
        <h1>📝 Notes Summarizer</h1>

        <!-- Short description of the feature. -->
        <p class="subtitle">
            Paste your notes and get a short, easy-to-understand summary.
        </p>


        <!-- This form sends the student's notes to the Flask backend. -->
        <form method="POST" class="notes-input-box">

            <!-- Label for the notes textarea. -->
            <label for="notes">
                Enter your notes
            </label>

            <!-- Student enters or pastes notes here. -->
            <textarea
                id="notes"
                name="notes"
                rows="12"
                placeholder="Paste your notes here..."
                required
            ></textarea>

            <!-- This button submits the notes for AI summarization. -->
            <button type="submit" class="summarize-btn">
                Summarize Notes ✨
            </button>

        </form>


        <!-- This section displays the AI-generated summary. -->
        <div class="summary-box">

            <h2>📚 Summary</h2>

            {% if summary %}

                <!-- Show which AI provider generated the summary. -->
                <p class="ai-provider">
                    Generated by: <strong>{{ provider }}</strong>
                </p>

                <!-- Display the formatted AI summary. -->
                <div class="ai-answer-content">
                    {{ summary|safe }}
                </div>

            {% else %}

                <!-- Default message before notes are submitted. -->
                <p>
                    Your AI-generated summary will appear here.
                </p>

            {% endif %}

        </div>


        <!-- Return to the main dashboard. -->
        <a href="/dashboard" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
