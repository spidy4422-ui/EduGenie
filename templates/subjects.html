<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Set character encoding for the subjects page -->
    <meta charset="UTF-8">

    <!-- Make the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Set the browser tab title -->
    <title>Subjects - EduGenie</title>

<!-- Load the common stylesheet and subjects-specific stylesheet -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/subjects.css') }}">

</head>

<body>

    <!-- Create navigation bar for the subjects page -->
    <nav class="dashboard-navbar">

        <!-- Display the EduGenie logo -->
        <div class="dashboard-logo">
            EduGenie
        </div>

        <!-- Provide navigation links -->
        <ul class="dashboard-nav-links">

            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/notes">Notes</a></li>
            <li><a href="/todos">To-Do</a></li>
            <li><a href="/logout">Logout</a></li>
        </ul>

    </nav>


    <!-- Main subjects management section -->
    <main class="subjects-page">

        <!-- Display the page heading -->
        <h1>My Subjects 📚</h1>

        <!-- Explain the purpose of this page -->
        <p>
            Add and manage your subjects from one place.
        </p>


        <!-- Create a form for adding a new subject -->
        <form class="subject-form" method="post" action="/subjects">

            <!-- Input field for entering subject name -->
            <input
                type="text"
                name="subject_name"
                placeholder="Enter subject name"
                required
            >

            <!-- Button for submitting the subject -->
            <button type="submit">
                Add Subject
            </button>

        </form>


        <!-- Display saved subjects -->
       <!-- Display subjects saved by the logged-in user -->
<section class="subject-list">

    {% for subject in subjects %}

        <!-- Display one subject from the database -->
        <div class="subject-card">
            <h3>{{ subject["subject_name"] }}</h3>
            <!-- Ask for confirmation before deleting the subject -->
             <a
                 href="/delete_subject/{{ subject['id'] }}"
                 class="delete-subject-btn"
                 onclick="return confirm('Are you sure you want to delete this subject?');"
                >
                 Delete
                 </a>
        </div>

    {% else %}

        <!-- Display this message when no subjects are available -->
        <p class="empty-subjects">
            No subjects added yet. Add your first subject above.
        </p>

    {% endfor %}

</section>

    </main>

</body>

</html>
