<!-- This page creates the UI for the AI Doubt Solver.
     We are starting with the frontend first; the AI API will be connected later. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Doubt Solver - EduGenie</title>

    <!-- This CSS file will contain the styling for the AI Doubt Solver page. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ai_doubt.css') }}">
</head>

<body>

    <!-- Main container for the AI Doubt Solver page -->
    <div class="ai-container">

        <!-- Page heading -->
        <h1>🤖 AI Doubt Solver</h1>

        <!-- Short description -->
        <p class="subtitle">
            Ask your academic question and get an AI-powered explanation.
        </p>

        <!-- Question input section -->
       <!-- This form sends the student's question to the Flask backend. -->
<form method="POST" class="question-box">

    <!-- Label for the question input. -->
    <label for="question">
        Enter your question
    </label>

    <!-- Text area where the student enters the doubt. -->
    <textarea
        id="question"
        name="question"
        placeholder="Example: Explain photosynthesis in simple words..."
        rows="6"
        required
    ></textarea>

    <!-- This button submits the question to Gemini through Flask. -->
    <button type="submit" class="ask-btn">
        Ask AI 🤖
    </button>

</form>

        </div>

        <!-- AI answer section -->
        <!-- This section displays either the Gemini answer or a friendly error message. -->
<!-- This section displays the AI-generated answer and shows
     which AI provider generated the response. -->
<div class="answer-box">

    <h2>💡 AI Answer</h2>

    {% if answer %}

        <!-- Show whether Gemini or OpenRouter generated the answer. -->
        <p class="ai-provider">
            Generated by: <strong>{{ provider }}</strong>
        </p>

        <!-- Display the properly formatted AI response. -->
        <div class="ai-answer-content">
            {{ answer|safe }}
        </div>

    {% else %}

        <!-- Default message before a question is submitted. -->
        <p>Your AI-generated answer will appear here.</p>

    {% endif %}

</div>

        <!-- Back to dashboard button -->
        <a href="/dashboard" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
